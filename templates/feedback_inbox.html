<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MindWatch — Feedback Inbox</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f4f7fb;
            color: #24303e;
        }
        .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 60px; }
        header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        header h1 { font-size: 22px; margin: 0 0 4px; }
        header p { margin: 0; color: #5b6b7c; font-size: 14px; }
        .box {
            background: #fff;
            border: 1px solid #dfe6ee;
            border-radius: 14px;
            padding: 16px;
            margin-top: 18px;
        }
        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #c8d2de;
            border-radius: 10px;
            font-size: 14px;
        }
        button {
            background: #2f6fed;
            color: #fff;
            border: 0;
            border-radius: 10px;
            padding: 11px 18px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #245bd0; }
        .status { font-size: 13px; min-height: 18px; margin-top: 8px; }
        .err { color: #c03939; }
        .ok { color: #16804d; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
        th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid #e7ecf2; vertical-align: top; }
        th { color: #5b6b7c; font-weight: 600; }
        .stars { color: #f5a623; letter-spacing: 1px; white-space: nowrap; }
        .empty { color: #5b6b7c; text-align: center; padding: 26px 0; font-size: 14px; }
        .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: #e8f2ff; color: #245bd0; }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <div>
                <h1>💬 MindWatch Feedback Inbox</h1>
                <p>Everything users have submitted, newest first.</p>
            </div>
        </header>

        <div class="box">
            <label for="adminToken" style="font-size:13px;font-weight:600;">Developer token</label>
            <input id="adminToken" type="password" placeholder="Paste MINDWATCH_ADMIN_TOKEN here" autocomplete="off">
            <button type="button" onclick="loadInbox()">Open my feedback</button>
            <div id="status" class="status"></div>
        </div>

        <div class="box" id="inboxBox" style="display:none;">
            <div id="emptyMsg" class="empty" style="display:none;">No feedback submitted yet.</div>
            <div id="tableWrap" style="display:none;overflow-x:auto;">
                <table>
                    <thead><tr><th>User</th><th>Rating</th><th>Message</th><th>When</th></tr></thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const savedKey = "mwAdminToken";

        function loadInbox() {

            const statusEl = document.getElementById("status");
            const tokenEl = document.getElementById("adminToken");
            const statusBox = document.getElementById("status");

            statusBox.className = "status";
            statusBox.textContent = "Loading...";

            let token = (tokenEl.value || "").trim();
            if (!token) token = sessionStorage.getItem(savedKey) || "";

            fetch("/api/all-feedback", {
                headers: { "X-Admin-Token": token }
            })
            .then(function (r) { return r.json(); })
            .then(function (data) {

                if (!data.success) {
                    statusBox.className = "status err";
                    statusBox.textContent = "✖ " + data.message;
                    return;
                }

                sessionStorage.setItem(savedKey, token);
                statusBox.textContent = "";

                const list = data.feedback || [];
                document.getElementById("emptyMsg").style.display =
                    list.length === 0 ? "" : "none";
                document.getElementById("tableWrap").style.display =
                    list.length === 0 ? "none" : "";
                document.getElementById("inboxBox").style.display = "";

                const rows = list.map(function (f) {

                    const stars = "★".repeat(f.rating) +
                                  "☆".repeat(5 - f.rating);

                    return `
                        <tr>
                            <td><b>${escapeHtml(f.user_name)}</b><br>
                                <span style="color:#5b6b7c;">${escapeHtml(f.user_email)}</span></td>
                            <td class="stars">${stars}</td>
                            <td>${escapeHtml(f.message)}</td>
                            <td style="white-space:nowrap;color:#5b6b7c;">${escapeHtml(f.created_at)}</td>
                        </tr>`;

                }).join("");

                document.getElementById("rows").innerHTML = rows;

            })
            .catch(function () {

                statusBox.className = "status err";
                statusBox.textContent = "✖ Could not reach the server.";

            });
        }

        function escapeHtml(value) {
            return String(value == null ? "" : value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        (function () {
            const saved = sessionStorage.getItem(savedKey);
            if (saved) {
                document.getElementById("adminToken").value = saved;
                loadInbox();
            }
        })();
    </script>
</body>
</html>
