<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindWatch AI - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
  <script>try{var _t=localStorage.getItem('mw-theme');if(_t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
</head>

<body class="auth">

    <div class="auth-card">

        <div class="brand">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none"
                     stroke="white" stroke-width="2.2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12h4l2-6 4 12 2-6h6" />
                </svg>
            </div>
            <div>
                <h1>MindWatch</h1>
                <p>AI Mental Health Monitoring</p>
            </div>
        </div>

        <h2>Welcome back</h2>
        <p class="sub">Sign in to your account to continue.</p>

        <form method="POST" action="/login">

            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   placeholder="you@example.com" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter your password" required>

            <button type="submit" class="btn-primary">Sign in</button>

        </form>

        <div class="alt">
            Don't have an account?
            <a href="/signup">Create Account</a>
        </div>

        <p class="demo-note">Demo mode &middot; use any registered email and password.</p>

    </div>

    <a href="/dev/login"
       style="display:block;text-align:center;margin-top:14px;font-size:10px;opacity:0.25;color:inherit;text-decoration:none;letter-spacing:0.3px;">
       ·
    </a>

</body>
</html>
