<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MindWatch — Developer Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #101a2b 0%, #1b2a44 100%);
            color: #eef3fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #fff;
            color: #24303e;
            border-radius: 18px;
            padding: 32px 28px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 18px 50px rgba(0,0,0,.35);
        }
        .card h1 { font-size: 22px; margin: 0 0 4px; }
        .card p { margin: 0 0 18px; color: #5b6b7c; font-size: 14px; }
        label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #c8d2de;
            border-radius: 10px;
            font-size: 14px;
        }
        button {
            width: 100%;
            margin-top: 18px;
            background: #2f6fed;
            color: #fff;
            border: 0;
            border-radius: 10px;
            padding: 12px;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover { background: #245bd0; }
        .err { color: #c03939; font-size: 13px; margin-top: 12px; min-height: 18px; }
        .back { display: block; text-align: center; margin-top: 16px; font-size: 13px; }
        .back a { color: #2f6fed; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔐 MindWatch Developer Login</h1>
        <p>For the app developer only. Logging in here shows the feedback inbox.</p>

        <form method="post" action="/dev/login">
            <label for="username">Developer username</label>
            <input id="username" name="username" type="text" autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button type="submit">Open Feedback Inbox</button>
            <div class="err">{{ error or "" }}</div>
        </form>

        <div class="back"><a href="{{ url_for('login') }}">← Back to user login</a></div>
    </div>
</body>
</html>
